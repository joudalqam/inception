services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    pull_policy: never
    container_name: mariadb
    restart: unless-stopped
    env_file: ./.env
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD", "sh", "-c", "mariadb --protocol=TCP -h127.0.0.1 --connect-timeout=2 -uroot -p\"$(cat /run/secrets/mysql_root_password)\" -e \"SELECT 1;\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    pull_policy: never
    container_name: wordpress
    restart: unless-stopped
    env_file: ./.env
    secrets:
      - mysql_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    pull_policy: never
    container_name: nginx
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception

volumes:
  mariadb_data:
    name: inception_mariadb_data
    driver: local
  wordpress_data:
    name: inception_wordpress_data
    driver: local

networks:
  inception:
    name: inception
    driver: bridge

secrets:
  mysql_root_password:
    file: ../secrets/db_root_password.txt
  mysql_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/credentials.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
